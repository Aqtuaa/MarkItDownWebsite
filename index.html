<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkItDown Converter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .upload-zone {
            border: 1.5px dashed #ccc;
            border-radius: 10px;
            padding: 40px 24px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #555;
            background: #fafafa;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .upload-label {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .upload-hint {
            font-size: 13px;
            color: #888;
        }

        .file-info {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 8px;
            font-size: 14px;
            color: #444;
            align-items: center;
            gap: 8px;
        }

        .file-info.visible { display: flex; }

        .file-info span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .remove-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            padding: 0 4px;
            line-height: 1;
        }

        .remove-btn:hover { color: #333; }

        .convert-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .convert-btn:hover { background: #333; }
        .convert-btn:disabled { background: #aaa; cursor: not-allowed; }

        .error-box {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            background: #fff2f2;
            border: 1px solid #fcc;
            border-radius: 8px;
            font-size: 14px;
            color: #c00;
        }

        .error-box.visible { display: block; }

        .result-section {
            display: none;
            margin-top: 28px;
        }

        .result-section.visible { display: block; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-label {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            font-size: 13px;
            padding: 5px 12px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            color: #333;
        }

        .copy-btn:hover { background: #f0f0f0; }
        .copy-btn.copied { color: #1a7a3e; border-color: #a8d5b5; background: #f0faf3; }

        .output {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 480px;
            overflow-y: auto;
            color: #1a1a1a;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>MarkItDown Converter</h1>
    <p class="subtitle">Convert PDF, DOCX, PPTX, XLSX, and more to Markdown instantly.</p>

    <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.xlsx,.txt,.html,.csv,.json,.xml">
        <div class="upload-icon">📄</div>
        <p class="upload-label">Click to choose a file</p>
        <p class="upload-hint">Supported: PDF, DOCX, PPTX, XLSX, TXT, HTML, CSV, JSON, XML</p>
    </div>

    <div class="file-info" id="fileInfo">
        <span id="fileName"></span>
        <button class="remove-btn" id="removeBtn" title="Remove file">✕</button>
    </div>

    <button class="convert-btn" id="convertBtn" disabled>Convert to Markdown</button>

    <div class="error-box" id="errorBox"></div>

    <div class="result-section" id="resultSection">
        <div class="result-header">
            <span class="result-label">Result</span>
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <pre class="output" id="output"></pre>
    </div>
</div>

<script>
    const uploadZone  = document.getElementById("uploadZone");
    const fileInput   = document.getElementById("fileInput");
    const fileInfo    = document.getElementById("fileInfo");
    const fileName    = document.getElementById("fileName");
    const removeBtn   = document.getElementById("removeBtn");
    const convertBtn  = document.getElementById("convertBtn");
    const errorBox    = document.getElementById("errorBox");
    const resultSection = document.getElementById("resultSection");
    const output      = document.getElementById("output");
    const copyBtn     = document.getElementById("copyBtn");

    uploadZone.addEventListener("click", () => fileInput.click());

    uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("dragover");
    });

    uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("dragover"));

    uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("dragover");
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            handleFileSelect();
        }
    });

    fileInput.addEventListener("change", handleFileSelect);

    function handleFileSelect() {
        const file = fileInput.files[0];
        if (!file) return;
        fileName.textContent = `${file.name}  (${(file.size / 1024).toFixed(1)} KB)`;
        fileInfo.classList.add("visible");
        convertBtn.disabled = false;
        errorBox.classList.remove("visible");
        resultSection.classList.remove("visible");
    }

    removeBtn.addEventListener("click", () => {
        fileInput.value = "";
        fileInfo.classList.remove("visible");
        convertBtn.disabled = true;
        errorBox.classList.remove("visible");
        resultSection.classList.remove("visible");
    });

    convertBtn.addEventListener("click", async () => {
        const file = fileInput.files[0];
        if (!file) return;

        convertBtn.disabled = true;
        convertBtn.innerHTML = '<span class="spinner"></span>Converting...';
        errorBox.classList.remove("visible");
        resultSection.classList.remove("visible");

        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch("/convert", {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error || "Conversion failed. Please try again.");
            } else {
                output.textContent = data.markdown;
                resultSection.classList.add("visible");
            }

        } catch (err) {
            showError("Cannot reach the server. Make sure app.py is running.");
        } finally {
            convertBtn.disabled = false;
            convertBtn.innerHTML = "Convert to Markdown";
        }
    });

    function showError(msg) {
        errorBox.textContent = "⚠ " + msg;
        errorBox.classList.add("visible");
    }

    copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(output.textContent).then(() => {
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
                copyBtn.textContent = "Copy";
                copyBtn.classList.remove("copied");
            }, 2000);
        });
    });
</script>

</body>
</html>
